services:
  - type: web
    name: acme-support-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ACME_AGENT_ALLOW_EXTERNAL_LLM
        value: "false"
      - key: ACME_UI_URL
        value: https://acme-support-ui.onrender.com

  - type: web
    name: acme-support-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh ./render-streamlit.sh
    envVars:
      - key: ACME_API_URL
        fromService:
          type: web
          name: acme-support-api
          envVarKey: RENDER_EXTERNAL_URL
